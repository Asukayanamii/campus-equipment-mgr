<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生端</title>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/user/user.css">
</head>
<body>

   
    <!-- 左侧导航栏 -->
    <div class="nav" id="nav">
        <!-- 欢迎语句 -->
        <div class="nav-title">
            <p>Welcome!</p>
        </div>

        <!-- 正式选项卡 -->
        <div class="nav-options">
            <a href="">数据展示</a>
            <a href="">我的记录</a>
        </div>

        <!-- 放个人头像 -->
        <div class="profile-showing">
            <button class="profile-picture-box" id="profile-picture-box">
                <img src="../assets/images/all-icon..png" alt="你的头像" id="profile-picture" class="profile-picture">
            </button>
            <div class="profile-name-box">
                <p class="profile-name" id="profile-name"></p>
            </div>
        </div>
    </div>
    
    <div class="place-holder">
        
    </div>

    <!-- 右侧区域 -->
     <div class="right-side">
        <!-- 搜索框 -->
         <div class="search-box">
            <p>搜索：<input type="text" class="search"></p>
         </div>
        <!-- 数据展示 -->
        <div class="data-showing" id="data-showing">
            
        </div>

        <!-- 页码选择 -->
        <div class="page-choose-box">
            <button id="start"></button>
            <button id="pre-2"></button>
            <button id="pre-1"></button>
            <button id="cur"></button>
            <button id="aft-1"></button>
            <button id="aft-2"></button>
            <button id="end"></button>
        </div>
     </div>
    
    <script src="../js/util.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/user/index.js"> </script>
</body>
</html>
