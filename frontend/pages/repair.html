<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#12352f">
    <title>维修工作台 | 校园设备管理</title>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/pagination-layout.css">
    <link rel="stylesheet" href="../css/repair/repair.css">
    <link rel="stylesheet" href="../css/polish.css">
    <link rel="stylesheet" href="../css/modal-polish.css">
    <link rel="stylesheet" href="../css/repair/orders.css">
    <link rel="stylesheet" href="../css/profile-center.css">
    <link rel="stylesheet" href="../css/workspace.css">
    <link rel="stylesheet" href="../css/image-preview.css">
</head>
<body class="workspace-app repair-app">

    <button class="mobile-menu-button" type="button" aria-label="打开导航" aria-controls="nav" aria-expanded="false">
        <span></span><span></span><span></span>
    </button>
    <button class="nav-backdrop" type="button" aria-label="关闭导航" tabindex="-1"></button>

   
    <!-- 左侧导航栏 -->
    <nav class="nav" id="nav" aria-label="维修端主导航">
        <!-- 欢迎语句 -->
        <div class="nav-title">
            <a class="workspace-brand" href="../index.html" aria-label="校园设备管理首页"><span class="workspace-brand-mark">校</span><span><strong>校园设备管理</strong><small>MAINTENANCE</small></span></a>
        </div>

        <!-- 正式选项卡 -->
        <div class="nav-options">
            <button id="repair-equipment-button">设备查询</button>
            <button id="repair-orders-button">我的工单</button>
        </div>

        <!-- 放个人头像 -->
        <div class="profile-showing">
            <button class="profile-picture-box" id="profile-picture-box">
                <img src="../assets/images/all-icon..png" alt="你的头像" id="profile-picture" class="profile-picture">
            </button>
            <div class="profile-name-box">
                <p class="profile-name" id="profile-name"></p>
            </div>
        </div>
    </nav>
    
    <div class="place-holder">
        
    </div>

    <!-- 右侧区域 -->
     <div class="right-side">
        <!-- 搜索框 -->
         <div class="search-box">
            <label>设备分类<select data-equipment-filter="categoryId" disabled><option value="">正在加载分类...</option></select></label><label>状态<input data-equipment-filter="status"></label><label>设备名称<input data-equipment-filter="equipmentName"></label><label>设备编号<input data-equipment-filter="equipmentNo"></label><label>位置<input data-equipment-filter="location"></label><label>品牌<input data-equipment-filter="brand"></label><label>规格<input data-equipment-filter="spec"></label><div class="filter-actions"><button type="button" class="multi-filter-submit">查询</button><button type="button" class="multi-filter-reset">重置</button></div>
            <input type="hidden" id="search">
            <select hidden id="search-way-choose" class="search-way-choose">
                <option value="no">请选择查询方式（支持联查）</option>
                <option value="reset">重置搜索</option>
                <option value="categoryId">设备分类名称</option>
                <option value="status">设备状态</option>
                <option value="equipmentName">设备名称</option>
                <option value="equipmentNo">设备编号</option>
                <option value="location">设备存放位置</option>
                <option value="brand">设备品牌</option>
                <option value="spec">设备规格型号</option>
                <option value="startTime">设备采购开始时间</option>
                <option value="endTime">设备采购结束时间</option>
            </select>
         </div>
        <!-- 数据展示 -->
        <div class="data-showing" id="data-showing">
            
        </div>

        <!-- 页码选择 -->
        <div class="page-choose-box">
            <button id="start"></button>
            <button id="pre-2"></button>
            <button id="pre-1"></button>
            <button id="cur"></button>
            <button id="aft-1"></button>
            <button id="aft-2"></button>
            <button id="end"></button>
        </div>
     </div>
    
    <script src="../js/util.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/upload-image.js"></script>
    <script src="../js/repair/orders-api.js"></script>
    <script src="../js/repair/index.js"> </script>
    <script src="../js/repair/orders.js"></script>
    <script src="../js/profile-center.js"></script>
    <script src="../js/workspace.js"></script>
    <script src="../js/image-preview.js"></script>
</body>
</html>
