<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="登录校园设备借用与维修管理系统">
    <title>登录 | 校园设备管理系统</title>
    <link rel="icon" type="image/png" href="./assets/images/all-icon..png">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
    <main class="login-page">
        <section class="campus-panel" aria-label="校园设备管理系统">
            <a class="back-home" href="./index.html" aria-label="返回首页">← 返回首页</a>
            <div class="campus-copy">
                <span class="brand-mark" aria-hidden="true">校</span>
                <p class="eyebrow">CAMPUS EQUIPMENT SERVICE</p>
                <h1>让校园设备<br>流转更简单</h1>
                <p>统一管理设备借用、归还与维修进度。</p>
            </div>
        </section>

        <section class="form-panel">
            <div class="login-box">
                <div class="form-heading">
                    <p class="mobile-brand">校园设备管理</p>
                    <h2>欢迎登录</h2>
                    <p>请选择身份并输入账号信息</p>
                </div>

                <form action="" class="login-form" id="login-form">
                    <fieldset class="identity-field">
                        <legend>登录身份</legend>
                        <div class="identity-choose" role="radiogroup" aria-label="登录身份">
                            <button id="student-choose" class="identity-option is-active" type="button" role="radio" aria-checked="true">学生</button>
                            <button id="admin-choose" class="identity-option" type="button" role="radio" aria-checked="false">管理员</button>
                            <button id="repair-choose" class="identity-option" type="button" role="radio" aria-checked="false">维修人员</button>
                        </div>
                    </fieldset>

                    <div class="input-data">
                        <label class="field" for="account">
                            <span>账号</span>
                            <input type="text" class="account" id="account" name="account" autocomplete="username" placeholder="请输入账号" required>
                        </label>
                        <label class="field" for="password">
                            <span>密码</span>
                            <span class="password-wrap">
                                <input type="password" class="password" id="password" name="password" autocomplete="current-password" placeholder="请输入密码" required>
                                <button class="password-toggle" id="password-toggle" type="button" aria-label="显示密码">显示</button>
                            </span>
                        </label>
                        <label class="field registration-field" for="registration-code" hidden>
                            <span>管理员注册码</span>
                            <input type="text" id="registration-code" name="registrationCode" autocomplete="off" placeholder="请输入管理员注册码">
                        </label>
                    </div>

                    <div class="button-showing">
                        <button id="submit-button" class="primary-button" type="submit">登录</button>
                        <button id="register-button" class="secondary-button" type="button">注册新账号</button>
                    </div>
                </form>
                <p class="form-note">首次使用请先注册账号</p>
            </div>
        </section>
    </main>
    <script src="./js/util.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/login.js"></script>
</body>
</html>
