server {
    listen 443 ssl;
    server_name asukayanami.top www.asukayanami.top;

    ssl_certificate /etc/letsencrypt/live/asukayanami.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asukayanami.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI 文档页面默认从根路径请求 OpenAPI 描述文件。
    location = /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name asukayanami.top www.asukayanami.top;

    # Let's Encrypt 通过 HTTP-01 校验域名归属，证书续期时仍会使用该目录。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 所有业务请求统一使用 HTTPS，避免明文传输登录令牌与用户资料。
    location / {
        return 301 https://asukayanami.top$request_uri;
    }
}
